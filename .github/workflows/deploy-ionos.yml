# Lädt die Website nach jedem Push auf main per SFTP auf den IONOS-Webspace.
# Zugangsdaten liegen als Secrets im GitHub-Repo (Settings → Secrets and variables → Actions):
#   IONOS_SFTP_HOST  z. B. access-5012345678.webspace-host.com
#   IONOS_SFTP_USER  z. B. u12345678
#   IONOS_SFTP_PASS  SFTP-Passwort
#   IONOS_SFTP_DIR   Zielordner der Domain auf dem Webspace, z. B. / oder /waigelbau
# Nicht hochgeladen werden: .git*, _build/, README.md, CLAUDE.md

name: Deploy auf IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ionos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.IONOS_SFTP_HOST }}
      USER: ${{ secrets.IONOS_SFTP_USER }}
      LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASS }}
      DIR: ${{ secrets.IONOS_SFTP_DIR }}
    steps:
      - name: Secrets prüfen
        id: check
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$LFTP_PASSWORD" ] || [ -z "$DIR" ]; then
            echo "::warning::IONOS-Secrets fehlen noch – Upload übersprungen."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: lftp installieren
        if: steps.check.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Per SFTP hochladen
        if: steps.check.outputs.ready == 'true'
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 30;
            open --env-password -u \"$USER\" sftp://$HOST;
            mirror --reverse --verbose --parallel=4 \
              -x '^\.git' -x '^_build/' -x '^README\.md$' -x '^CLAUDE\.md$' \
              ./ \"$DIR\"
          "
